<!DOCTYPE html> <html lang="ko"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>토크박스 질문 응답 뷰어 (실시간 대시보드)</title> <meta name="theme-color" content="#1b2a4a" /> <link rel="preconnect" href="https://fonts.googleapis.com" /> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /> <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet" /> <script src="https://cdn.tailwindcss.com"></script> <script> tailwind.config = { theme: { extend: { colors: { brand: { navy: '#1b2a4a', gold: '#c59b27', goldLight: '#fbf7ee', beige: '#fcf9f3', dark: '#1c1917', border: '#e7e3da' } }, fontFamily: { sans: ['"Noto Sans KR"', 'sans-serif'], serif: ['"Noto Serif KR"', 'serif'] } } } } </script> <style> body { background-color: #f7f4ed; color: #2b2825; font-family: 'Noto Sans KR', sans-serif; } .card-enter { animation: fadeIn 0.3s ease forwards; } @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } } </style> <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script> <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script> <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script> </head> <body class="min-h-screen pb-16"> <!-- 상단 글로벌 바 --> <header class="bg-white/90 backdrop-blur sticky top-0 z-30 border-b border-brand-border px-4 py-3 sm:px-8"> <div class="max-w-4xl mx-auto flex items-center justify-between"> <div class="flex items-center gap-3"> <div class="w-9 h-9 rounded-full bg-brand-navy flex items-center justify-center text-white text-base shadow-sm"> ⛪ </div> <div> <div class="flex items-center gap-2"> <span class="text-xs font-semibold text-stone-500">예은교회 · 현장 관리</span> <span id="syncBadge" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200"> <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> 실시간 연동 중 </span> </div> <h1 class="text-lg font-bold text-brand-navy leading-tight">토크박스 질문 응답 뷰어</h1> </div> </div> <div class="flex items-center gap-2"> <a href="index.html" target="_blank" class="px-3 py-1.5 rounded-lg bg-brand-navy text-white text-xs font-semibold hover:bg-brand-navy/90 transition shadow-sm"> 📝 질문 접수창 열기 ↗ </a> </div> </div> </header> <!-- 본문 --> <main class="max-w-4xl mx-auto px-4 sm:px-6 pt-6 flex flex-col gap-5"> <!-- 통계 카드 --> <section class="grid grid-cols-3 gap-3"> <div class="bg-white rounded-2xl p-4 border border-brand-border shadow-sm text-center"> <span class="text-xs text-stone-500 font-medium block mb-1">총 접수 질문</span> <span id="statTotal" class="text-2xl font-black text-brand-navy">0</span><span class="text-xs text-stone-500 ml-0.5">건</span> </div> <div class="bg-white rounded-2xl p-4 border border-brand-border shadow-sm text-center"> <span class="text-xs text-stone-500 font-medium block mb-1">토크쇼 채택</span> <span id="statAdopted" class="text-2xl font-black text-amber-600">0</span><span class="text-xs text-stone-500 ml-0.5">건</span> </div> <div class="bg-white rounded-2xl p-4 border border-brand-border shadow-sm text-center"> <span class="text-xs text-stone-500 font-medium block mb-1">보관/미채택</span> <span id="statPending" class="text-2xl font-black text-stone-700">0</span><span class="text-xs text-stone-500 ml-0.5">건</span> </div> </section> <!-- 검색 및 카테고리 필터 --> <section class="bg-white rounded-2xl p-4 border border-brand-border shadow-sm flex flex-col gap-3"> <div class="relative"> <input type="text" id="searchInput" oninput="renderQuestions()" placeholder="작성자 이름, 직분, 키워드로 검색..." class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-stone-300 text-sm focus:outline-none focus:ring-2 focus:ring-brand-navy/30 focus:border-brand-navy transition bg-stone-50/50" /> <span class="absolute left-3 top-3 text-stone-400 text-sm">🔍</span> </div> <div class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs"> <button onclick="setFilter('all')" id="tab-all" class="filter-tab px-3.5 py-1.5 rounded-full font-bold bg-brand-navy text-white transition"> 전체 보기 (<span id="count-all">0</span>) </button> <button onclick="setFilter('관심사')" id="tab-관심사" class="filter-tab px-3.5 py-1.5 rounded-full font-medium bg-stone-100 text-stone-600 hover:bg-stone-200 transition"> 🌿 관심사 & 일상 (<span id="count-관심사">0</span>) </button> <button onclick="setFilter('학교')" id="tab-학교" class="filter-tab px-3.5 py-1.5 rounded-full font-medium bg-stone-100 text-stone-600 hover:bg-stone-200 transition"> 📖 학교에서의 추억 (<span id="count-학교">0</span>) </button> <button onclick="setFilter('예은교회')" id="tab-예은교회" class="filter-tab px-3.5 py-1.5 rounded-full font-medium bg-stone-100 text-stone-600 hover:bg-stone-200 transition"> ⛪ 예은교회와의 추억 (<span id="count-예은교회">0</span>) </button> <button onclick="setFilter('adopted')" id="tab-adopted" class="filter-tab px-3.5 py-1.5 rounded-full font-medium bg-amber-50 text-amber-700 border border-amber-200 transition"> ⭐ 채택된 질문만 (<span id="count-adopted">0</span>) </button> </div> </section> <!-- 선택 삭제 바 --> <section class="flex items-center justify-between px-1 text-xs"> <div class="flex items-center gap-3"> <label class="flex items-center gap-2 cursor-pointer font-medium text-stone-700 select-none"> <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)" class="w-4 h-4 rounded text-brand-navy" /> <span>전체 선택</span> </label> <span class="text-stone-400">|</span> <button onclick="deleteSelected()" id="deleteSelectedBtn" class="text-red-600 hover:text-red-700 font-medium transition disabled:opacity-40" disabled> 🗑️ 선택 항목 삭제 (<span id="selectedCount">0</span>) </button> </div> <span class="text-stone-500 font-medium">검색 결과: <strong id="resultCount" class="text-brand-navy font-bold">0</strong>건</span> </section> <!-- 카드 리스트 컨테이너 --> <div id="questionsContainer" class="flex flex-col gap-3"> <div id="loadingState" class="p-12 text-center bg-white rounded-2xl border border-brand-border shadow-sm"> <div class="text-3xl mb-2 animate-bounce">⏳</div> <p class="text-sm font-semibold text-brand-navy">실시간 질문 데이터를 불러오는 중입니다...</p> </div> </div> </main> <script> const firebaseConfig = { apiKey: "AIzaSyA74Q3XR1--xQmAv13RWhO_GYhisqUTjo0", authDomain: "yeeun33rd.firebaseapp.com", databaseURL: "https://yeeun33rd-default-rtdb.firebaseio.com", projectId: "yeeun33rd", storageBucket: "yeeun33rd.firebasestorage.app", messagingSenderId: "527650055481", appId: "1:527650055481:web:e750e4ecb15822ca4bb4e8" }; firebase.initializeApp(firebaseConfig); const rtdb = firebase.database(); const firestore = firebase.firestore(); let allQuestionsMap = new Map(); let currentFilter = 'all'; let selectedIds = new Set(); // 1. Realtime DB 실시간 동기화 rtdb.ref('questions').on('value', (snapshot) => { const data = snapshot.val(); if (data) { Object.keys(data).forEach(key => { allQuestionsMap.set('rtdb_' + key, { id: key, source: 'rtdb', ...data[key] }); }); } onDataUpdated(); }); // 2. Firestore 실시간 동기화 firestore.collection('questions').onSnapshot((snapshot) => { snapshot.forEach(doc => { allQuestionsMap.set('fs_' + doc.id, { id: doc.id, source: 'firestore', ...doc.data() }); }); onDataUpdated(); }); function onDataUpdated() { document.getElementById('loadingState')?.remove(); renderQuestions(); } function setFilter(filter) { currentFilter = filter; document.querySelectorAll('.filter-tab').forEach(btn => { btn.className = 'filter-tab px-3.5 py-1.5 rounded-full font-medium bg-stone-100 text-stone-600 hover:bg-stone-200 transition'; }); const active = document.getElementById(`tab-${filter}`); if (active) active.className = 'filter-tab px-3.5 py-1.5 rounded-full font-bold bg-brand-navy text-white transition'; renderQuestions(); } function renderQuestions() { const container = document.getElementById('questionsContainer'); const search = document.getElementById('searchInput').value.trim().toLowerCase(); let questions = Array.from(allQuestionsMap.values()); // 최신순 정렬 questions.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); // 중복 질문 제거 (내용과 작성자가 같은 경우 하나만 표시) const unique = []; const seen = new Set(); for (const q of questions) { const key = `${q.author}_${q.question}`; if (!seen.has(key)) { seen.add(key); unique.push(q); } } questions = unique; const countAll = questions.length; const countInterest = questions.filter(q => (q.category || '').includes('관심사')).length; const countSchool = questions.filter(q => (q.category || '').includes('학교')).length; const countChurch = questions.filter(q => (q.category || '').includes('예은교회')).length; const countAdopted = questions.filter(q => q.isAdopted).length; document.getElementById('statTotal').innerText = countAll; document.getElementById('statAdopted').innerText = countAdopted; document.getElementById('statPending').innerText = countAll - countAdopted; document.getElementById('count-all').innerText = countAll; document.getElementById('count-관심사').innerText = countInterest; document.getElementById('count-학교').innerText = countSchool; document.getElementById('count-예은교회').innerText = countChurch; document.getElementById('count-adopted').innerText = countAdopted; const filtered = questions.filter(item => { if (currentFilter === '관심사' && !(item.category || '').includes('관심사')) return false; if (currentFilter === '학교' && !(item.category || '').includes('학교')) return false; if (currentFilter === '예은교회' && !(item.category || '').includes('예은교회')) return false; if (currentFilter === 'adopted' && !item.isAdopted) return false; if (search) { const matchAuthor = (item.author || '').toLowerCase().includes(search); const matchContent = (item.question || '').toLowerCase().includes(search); if (!matchAuthor && !matchContent) return false; } return true; }); document.getElementById('resultCount').innerText = filtered.length; if (filtered.length === 0) { container.innerHTML = ` <div class="p-12 text-center bg-white rounded-2xl border border-brand-border shadow-sm"> <span class="text-3xl mb-2 block">📭</span> <p class="text-sm font-semibold text-brand-navy">등록된 질문이 없습니다.</p> <p class="text-xs text-stone-400 mt-1">성도님들이 질문을 접수하면 이곳에 실시간으로 즉시 나타납니다.</p> </div> `; updateSelectionState(); return; } let html = ''; filtered.forEach(q => { const isChecked = selectedIds.has(q.id); const dateStr = q.createdAt ? new Date(q.createdAt).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', month: 'numeric', day: 'numeric' }) : '방금 전'; let badgeColor = 'bg-stone-100 text-stone-600'; let badgeEmoji = '🏷️'; if ((q.category || '').includes('관심사')) { badgeColor = 'bg-emerald-50 text-emerald-700 border border-emerald-200'; badgeEmoji = '🌿'; } else if ((q.category || '').includes('학교')) { badgeColor = 'bg-blue-50 text-blue-700 border border-blue-200'; badgeEmoji = '📖'; } else if ((q.category || '').includes('예은교회')) { badgeColor = 'bg-amber-50 text-amber-800 border border-amber-200'; badgeEmoji = '⛪'; } html += ` <div class="card-enter bg-white p-5 rounded-2xl border ${q.isAdopted ? 'border-amber-300 ring-2 ring-amber-300/30 bg-amber-50/20' : 'border-brand-border'} shadow-sm transition hover:shadow-md"> <div class="flex items-start justify-between gap-3"> <div class="flex items-center gap-2.5"> <input type="checkbox" data-id="${q.id}" ${isChecked ? 'checked' : ''} onchange="toggleItemSelect('${q.id}', this.checked)" class="w-4 h-4 rounded text-brand-navy cursor-pointer" /> <span class="text-xs px-2.5 py-0.5 rounded-full font-medium ${badgeColor}"> ${badgeEmoji} ${q.category || '일반 질문'} </span> ${q.isAdopted ? '<span class="text-[11px] px-2 py-0.5 rounded-full bg-amber-500 text-white font-bold">토크쇼 채택</span>' : ''} </div> <div class="flex items-center gap-1.5"> <button onclick="toggleAdopt('${q.source}', '${q.id}', ${!q.isAdopted})" class="p-1 text-stone-400 hover:text-amber-500 text-base"> ${q.isAdopted ? '⭐' : '☆'} </button> <button onclick="deleteSingle('${q.source}', '${q.id}')" class="p-1 text-stone-400 hover:text-red-600 text-base"> 🗑️ </button> </div> </div> <p class="text-stone-800 font-medium text-sm sm:text-base leading-relaxed mt-3 whitespace-pre-wrap"> "${escapeHtml(q.question)}" </p> <div class="flex items-center justify-between mt-4 pt-3 border-t border-stone-100 text-xs text-stone-500"> <div class="flex items-center gap-1.5 font-semibold text-brand-navy"> <span>👤</span> <span>${escapeHtml(q.author || '성도')}</span> </div> <span class="text-[11px] text-stone-400">${dateStr}</span> </div> </div> `; }); container.innerHTML = html; updateSelectionState(); } function escapeHtml(str) { if (!str) return ''; return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); } async function toggleAdopt(source, id, newState) { try { if (source === 'rtdb') await rtdb.ref(`questions/${id}`).update({ isAdopted: newState }); if (source === 'firestore') await firestore.collection('questions').doc(id).update({ isAdopted: newState }); } catch (e) { alert("채택 실패: " + e.message); } } async function deleteSingle(source, id) { if (!confirm("이 질문을 삭제하시겠습니까?")) return; try { if (source === 'rtdb') await rtdb.ref(`questions/${id}`).remove(); if (source === 'firestore') await firestore.collection('questions').doc(id).delete(); selectedIds.delete(id); allQuestionsMap.delete(source === 'rtdb' ? 'rtdb_' + id : 'fs_' + id); renderQuestions(); } catch (e) { alert("삭제 실패: " + e.message); } } function toggleItemSelect(id, checked) { if (checked) selectedIds.add(id); else selectedIds.delete(id); updateSelectionState(); } function toggleSelectAll(master) { document.querySelectorAll('#questionsContainer input[type="checkbox"]').forEach(input => { const id = input.getAttribute('data-id'); input.checked = master.checked; if (master.checked) selectedIds.add(id); else selectedIds.delete(id); }); updateSelectionState(); } function updateSelectionState() { const count = selectedIds.size; document.getElementById('selectedCount').innerText = count; document.getElementById('deleteSelectedBtn').disabled = (count === 0); } async function deleteSelected() { const count = selectedIds.size; if (count === 0 || !confirm(`선택한 ${count}개 질문을 삭제하시겠습니까?`)) return; for (const id of selectedIds) { await rtdb.ref(`questions/${id}`).remove().catch(()=>{}); await firestore.collection('questions').doc(id).delete().catch(()=>{}); allQuestionsMap.delete('rtdb_' + id); allQuestionsMap.delete('fs_' + id); } selectedIds.clear(); renderQuestions(); } </script> </body> </html>
